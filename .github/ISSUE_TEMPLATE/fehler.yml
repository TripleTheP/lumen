name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, was ist stattdessen geschehen? Wenn möglich mit Schritten zum Nachstellen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lumen-Version
      description: Menü → Über Lumen
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows-Version
      description: Win+R → winver
      placeholder: "Windows 11 24H2 (Build 26100)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Grafikkarte und Bildschirme
      placeholder: "RTX 4070, 3 × 2560×1440"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Inhalt von `%APPDATA%\Lumen\lumen.log`
      render: text
