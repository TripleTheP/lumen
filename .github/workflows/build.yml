name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: MinGW installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Bauen
        run: make -j4
      - uses: actions/upload-artifact@v7
        with:
          name: Lumen
          path: build/Lumen.exe

  # Bei einem Tag wie v0.2.0 entsteht automatisch ein GitHub-Release mit der exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Lumen
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Lumen.exe --draft --title "Lumen ${GITHUB_REF_NAME#v}" --generate-notes
